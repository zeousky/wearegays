server {
    listen 80;
    server_name www.wearegays.net;
    return 301 https://wearegays.net$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    absolute_redirect off;

    location ~* ^/wearegays(?:\.html)?/?$ { return 301 /gays/; }
    location ~* ^/wearetrans(?:\.html)?/?$ { return 301 /trans/; }
    location ~* ^/wearelesbians(?:\.html)?/?$ { return 301 /lesbians/; }
    location ~* ^/wearebi(?:\.html)?/?$ { return 301 /bi/; }
    location ~* ^/wearepan(?:\.html)?/?$ { return 301 /pan/; }
    location ~* ^/wearenb(?:\.html)?/?$ { return 301 /nb/; }
    location ~* ^/weare(?:ase|ace)(?:\.html)?/?$ { return 301 /ace/; }

    location / {
        try_files $uri $uri/ =404;
    }
}
