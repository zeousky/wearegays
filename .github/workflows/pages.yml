name: Publish We Are Gays

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      - name: Package the public poster site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        shell: bash
        run: |
          mkdir -p _site/assets/editorial _site/.well-known
          cp index.html 404.html robots.txt video.css video.js video.mp4 _site/
          cp -R ace bi gays israel lesbians nb pan trans _site/
          cp assets/site.css _site/assets/
          cp assets/editorial/{display.ttf,italic.ttf,OFL-Barlow.txt,OFL-Cormorant.txt} _site/assets/editorial/
          cp .well-known/security.txt _site/.well-known/

          for page in _site/index.html _site/{ace,bi,gays,lesbians,nb,pan,trans}/index.html; do
            sed "s|https://wearegays.net/|$SITE_URL/|g" "$page" > "$page.tmp"
            mv "$page.tmp" "$page"
          done
          for page in _site/404.html _site/israel/index.html; do
            sed "s|href=\"/|href=\"$BASE_PATH/|g" "$page" > "$page.tmp"
            mv "$page.tmp" "$page"
          done

          for identity in ace ase bi gays lesbians nb pan trans; do
            target="$BASE_PATH/${identity/ase/ace}/"
            alias="weare$identity"
            mkdir "_site/$alias"
            cat > "_site/$alias/index.html" <<HTML
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=$target">
          <meta name="robots" content="noindex">
          <title>Moved · wearegays.net</title>
          <p><a href="$target">Continue to the poster</a>.</p>
          </html>
          HTML
            cp "_site/$alias/index.html" "_site/$alias.html"
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          include-hidden-files: true

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
